<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}{% endblock %}</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/favicon/apple-touch-icon.png">

    <link rel="stylesheet" href="{{ url_for('static', filename='styles/base_Style.css') }}">

    {% block styles %}{% endblock %}
</head>

<body>
    <header class="global-header">
        <div class="logo-bar">
            <a href="{{ url_for('index') }}">
                <img src="/static/logo/logo.png" class="main-logo" alt="Logo">
            </a>

            <div class="right-icons">
                {% block header_icons %}{% endblock %}
                <form action="{{ url_for('logout') }}" method="POST" class="icon-form logo-btns">
                    <button type="submit" class="logout-btn" title="Logout">
                        <img src="/static/icons/logout.png" alt="logout">
                    </button>
                </form>
            </div>
        </div>
    </header>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="msg-wrapper">
                <div class="msg" id="flash-msg">{{ messages[0] }}</div>
            </div>
        {% endif %}
    {% endwith %}

    <div class="page-content">
        {% block content %}{% endblock %}
    </div>

    <footer class="app-footer">
        <p>MediaHub - {{ app_version }}</p>
    </footer>

    <script src="{{ url_for('static', filename='script/message.js') }}"></script>
    {% block scripts %}{% endblock %}

</body>
</html>
